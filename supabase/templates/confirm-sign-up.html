<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>위클리픽에 오신 것을 환영해요</title></head>
<body style="margin:0;padding:0;background:#f5f5f5;color:#111111;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">이메일을 확인하고 마음에 드는 전시와 주말 계획을 계정에 보관하세요.</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;background:#ffffff;border-radius:16px;"><tr><td style="padding:32px 24px;">
      <p style="margin:0 0 28px;font-size:14px;font-weight:bold;letter-spacing:2px;">WEEKLY PICK</p>
      <h1 style="margin:0 0 16px;font-size:26px;line-height:1.4;word-break:keep-all;">위클리픽에 오신 것을 환영해요</h1>
      <p style="margin:0 0 24px;font-size:16px;line-height:1.7;word-break:keep-all;">이메일을 확인하고 마음에 드는 전시와 주말 계획을 계정에 보관하세요.</p>
      <table role="presentation" cellspacing="0" cellpadding="0" border="0"><tr><td bgcolor="#111111" style="border-radius:24px;text-align:center;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 24px;color:#ffffff;text-decoration:none;font-size:16px;font-weight:bold;line-height:1.4;">이메일 확인하고 시작하기</a>
      </td></tr></table>
      <p style="margin:24px 0 0;font-size:14px;line-height:1.7;color:#4a4a4a;">메일을 요청한 브라우저에서 열어 주세요. 이 링크는 한 번만 사용할 수 있어요. 만료되었다면 로그인 화면에서 새 링크를 요청해 주세요.</p>
      <p style="margin:20px 0 0;font-size:13px;line-height:1.7;color:#6a6a6a;">직접 요청하지 않았다면 이 메일을 무시하셔도 됩니다.</p>
    </td></tr></table>
    <p style="margin:20px 0 0;font-size:12px;color:#6a6a6a;">위클리픽 · 이번 주말, 갈 만한 것만</p>
  </td></tr></table>
</body>
</html>
