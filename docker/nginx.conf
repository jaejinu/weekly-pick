server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    charset_types text/css application/javascript text/plain;

    # 해시 라우팅(#/home)이라 서버 리라이트는 필요 없지만,
    # 직접 입력한 경로도 앱으로 떨어지게 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 은 캐시하지 않는다 (배포 즉시 반영)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # CSS/JS 는 파일명이 고정이라 캐시하면 배포 후 옛 파일이 남는다.
    # 전체 30KB 남짓이라 매번 재검증시킨다.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # 이미지는 캐시하되, 같은 파일명으로 교체하는 일이 잦아 1시간으로 짧게 잡는다.
    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript text/plain application/json image/svg+xml;
    gzip_min_length 512;

    # 이 앱은 자체 파일 + 폰트/아이콘 CDN 만 사용한다
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "no-referrer-when-downgrade";
}
